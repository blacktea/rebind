name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: default
            build_dir: build
            cmake_args: ""
          - name: address-sanitizer
            build_dir: build-asan
            cmake_args: "-DENABLE_ADDRESS_SANITIZER=ON"
          - name: undefined-sanitizer
            build_dir: build-ubsan
            cmake_args: "-DENABLE_UNDEFINED_SANITIZER=ON"
    env:
      IMAGE_NAME: rebind-ci
      CONTAINER_NAME: rebind-ci-${{ matrix.name }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t "${IMAGE_NAME}" .

      - name: Run Docker image
        run: |
          docker run -d --name "${CONTAINER_NAME}" \
            -v "${{ github.workspace }}:/rebind" \
            -w /rebind \
            "${IMAGE_NAME}" \
            bash -lc 'sleep infinity'

      - name: Build project
        run: |
          docker exec "${CONTAINER_NAME}" bash -lc '
            set -euo pipefail
            export PATH="/root/.local/bin:$PATH"

            python3 -m venv .venv
            source .venv/bin/activate
            poetry install

            CXX_COMPILER="$(command -v g++ || command -v c++)"
            cmake -S . -B "${{ matrix.build_dir }}" -DCMAKE_CXX_COMPILER="${CXX_COMPILER}" ${{ matrix.cmake_args }}
            cmake --build "${{ matrix.build_dir }}"
          '

      - name: Test project
        run: |
          docker exec "${CONTAINER_NAME}" bash -lc '
            set -euo pipefail
            source .venv/bin/activate
            cmake --build "${{ matrix.build_dir }}" --target pytest
          '

      - name: Stop Docker container
        if: always()
        run: docker rm -f "${CONTAINER_NAME}"
